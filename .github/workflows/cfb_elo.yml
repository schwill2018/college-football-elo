name: Update College Elo

on:
  # Daily at 08:00 UTC: 3 a.m. Chicago daylight time / 2 a.m. standard time.
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: college-elo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the project and saved seasonal parameters
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the required Python libraries
        run: python -m pip install -r requirements.txt

      - name: Verify Elo cache behavior
        run: python -m unittest discover -s tests -v

      - name: Update ratings and projections
        run: python -u cfb_elo.py

      - name: Save updated CSVs and seasonal parameters to GitHub
        env:
          OUTPUT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/cfb_overtime_supplement.csv \
            elo_parameters.csv \
            current_elo_rankings.csv \
            daily_projections.csv \
            weekly_projections.csv \
            future_projections.csv \
            cfb_elo_history.csv \
            performance_by_year.csv \
            spread_performance_by_year.csv
          if git diff --cached --quiet; then
            echo "No output changes to save."
            exit 0
          fi
          git commit -m "Update College Elo outputs"
          git push origin "HEAD:$OUTPUT_BRANCH"
